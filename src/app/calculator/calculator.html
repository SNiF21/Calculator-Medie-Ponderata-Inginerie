<section class="max-w-3xl mx-auto">
	<h2 class="text-2xl font-semibold mb-2">Calculator Medie Ponderată</h2>
	<p class="text-sm text-slate-600 mb-4">Profil: <strong>{{ profileKey }}</strong></p>

	<div class="space-y-4">
		<div *ngFor="let subject of subjects()" class="p-4 border rounded flex items-center justify-between">
			<div>
				<div class="font-medium">{{ subject.name }}</div>
				<div class="text-sm text-slate-500">Credite: {{ subject.credits }} • Tip: {{ subject.type }}</div>
			</div>
			<div class="flex items-center space-x-3">
				<input
					type="number"
					min="1"
					max="10"
					class="w-20 px-2 py-1 border rounded"
					[value]="grades()[subject.name] ?? ''"
					(input)="setGrade(subject.name, $any($event.target).value)"
					aria-label="Nota pentru {{ subject.name }}"
				/>
			</div>
		</div>
	</div>

	<div class="mt-6 p-4 bg-slate-50 rounded border">
		<div class="text-sm text-slate-600">Medie ponderată calculată:</div>
		<div class="text-3xl font-bold">
			<ng-container *ngIf="weightedAverage() !== null; else noAverage">{{ weightedAverage() }}</ng-container>
			<ng-template #noAverage>—</ng-template>
		</div>
		<div class="text-sm text-slate-500">Total credite: {{ totalCredits() }}</div>
	</div>

	<div class="mt-4 flex space-x-3">
		<button class="px-4 py-2 bg-red-500 text-white rounded" (click)="resetGrades()">Resetează</button>
		<button class="px-4 py-2 bg-green-600 text-white rounded" (click)="saveLocal()">Salvează local</button>
	</div>
</section>
